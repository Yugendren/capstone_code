<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PressureMat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #ccc;
  }
  .logo {
    font-size: 42px;
    font-weight: 700;
    color: #4a90d9;
    letter-spacing: 4px;
    margin-bottom: 30px;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #2a2a4a;
    border-top-color: #4a90d9;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .status {
    font-size: 14px;
    color: #666;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="logo">PRESSUREMAT</div>
  <div class="spinner"></div>
  <div class="status">Starting...</div>
</body>
</html>
